<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F9EAF2" />
  <title>小芽成长</title>
  <style>
    :root{
      --canvas:#F9EAF2;--canvas-deep:#F3D6E7;--ink:#2B1B24;--muted:#8A6B7A;
      --glass:rgba(255,255,255,.68);--glass-edge:rgba(255,255,255,.82);
      --pink:#FF2D95;--pink-soft:#FF6B9D;--pink-deep:#E11D7A;
      --health:#5CD6A0;--language:#FFB07C;--social:#FF6B9D;--science:#A78BFA;--art:#F472B6;
      --radius-lg:28px;--radius-md:20px;
      --safe-bottom:max(88px,env(safe-area-inset-bottom,88px));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;min-height:100%;font-family:"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;color:var(--ink)}
    body{background:radial-gradient(120% 80% at 10% -10%,rgba(255,45,149,.18),transparent 50%),radial-gradient(100% 70% at 90% 0%,rgba(244,114,182,.2),transparent 45%),radial-gradient(80% 50% at 50% 100%,rgba(167,139,250,.16),transparent 50%),linear-gradient(180deg,var(--canvas),var(--canvas-deep));background-attachment:fixed}
    button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
    .app{width:min(100%,430px);margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 16px var(--safe-bottom);position:relative}
    .glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:var(--radius-lg);box-shadow:0 10px 40px rgba(224,80,140,.14),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
    .glass-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;margin-bottom:14px;position:sticky;top:12px;z-index:20}
    .brand-kicker{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--pink)}
    .brand-title{font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.02em}
    .age-badge{text-align:right;flex-shrink:0}
    .age-badge .days{display:inline-flex;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(255,45,149,.16),rgba(244,114,182,.22));border:1px solid rgba(255,45,149,.2);color:var(--pink-deep);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;font-weight:700}
    .age-badge .meta{margin-top:6px;font-size:12px;color:var(--muted);font-weight:500}
    .date-row{display:flex;align-items:baseline;gap:10px;margin:2px 0 14px}
    .date-row .wd{font-size:15px;font-weight:700;color:var(--pink)}
    .date-row .full{font-size:13px;color:var(--muted)}
    .ribbon{padding:18px;margin-bottom:16px}
    .ribbon-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
    .ribbon-top h2{margin:0;font-size:15px;font-weight:600}
    .ribbon-top .budget{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;font-weight:700;color:var(--pink)}
    .ribbon-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(255,107,157,.12);font-size:12px;font-weight:600}
    .pill .orb,.orb{width:10px;height:10px;border-radius:50%}
    .pill .min{color:var(--muted);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700}
    .ribbon-bar{margin-top:14px;height:10px;border-radius:999px;overflow:hidden;display:flex;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7)}
    .ribbon-bar span{height:100%}
    .progress-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;margin-top:8px}
    .progress-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink-soft));border-radius:inherit}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
    .section-title h2{margin:0;font-size:20px;font-weight:700}
    .section-title .hint{font-size:12px;color:var(--muted);font-weight:500}
    .cards{display:flex;flex-direction:column;gap:12px}
    .card{padding:16px;text-align:left;width:100%;display:block}
    .card:active{transform:scale(.985)}
    .card-head{display:flex;gap:12px;align-items:flex-start;width:100%}
    .orb-lg{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:18px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),transparent 40%),var(--orb-color,var(--pink-soft));box-shadow:0 6px 16px color-mix(in srgb,var(--orb-color,var(--pink-soft)) 35%,transparent),inset 0 0 0 1px rgba(255,255,255,.45)}
    .card-body{flex:1;min-width:0}
    .card-title{margin:0 0 4px;font-size:16px;font-weight:700}
    .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.7);color:var(--muted);border:1px solid rgba(255,255,255,.8)}
    .chip.focus{color:var(--pink-deep);background:rgba(255,45,149,.1);border-color:rgba(255,45,149,.18)}
    .card-guide{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
    .card-steps{margin:10px 0 0;padding:0;list-style:none;display:none;flex-direction:column;gap:6px;counter-reset:step}
    .card.open .card-steps,.card-steps.always{display:flex}
    .card-steps li{font-size:13px;line-height:1.45;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.55);color:var(--ink);counter-increment:step}
    .card-steps li::before{content:counter(step) ". ";color:var(--pink);font-weight:700;font-family:ui-monospace,"SF Mono",Menlo,monospace}
    .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
    .card-tip{font-size:12px;color:var(--pink-deep);flex:1;line-height:1.4}
    .check{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.75);border:2px solid rgba(255,107,157,.45);color:transparent;font-weight:800;flex-shrink:0}
    .check.on{background:linear-gradient(135deg,var(--pink),var(--pink-soft));border-color:transparent;color:#fff}
    .card.done .card-title{opacity:.72}
    .brave{margin-bottom:16px;padding:16px 18px;border-color:rgba(255,45,149,.3);background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,107,157,.12))}
    .brave h3{margin:0 0 6px;font-size:16px;color:var(--pink-deep)}
    .brave p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
    .guide-tag{display:inline-block;margin-top:8px;font-size:11px;color:var(--pink-deep);background:rgba(255,45,149,.1);border-radius:999px;padding:4px 8px;font-weight:600}
    .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,12px));width:min(calc(100% - 24px),406px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;z-index:40;border-radius:26px}
    .tab{min-height:52px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600}
    .tab.active{color:var(--pink-deep);background:rgba(255,45,149,.12);box-shadow:inset 0 0 0 1px rgba(255,45,149,.12)}
    .tab .ico{font-size:18px;line-height:1}
    .page-block{margin-bottom:14px;padding:16px 18px}
    .page-block h3{margin:0 0 6px;font-size:16px;font-weight:700}
    .page-block p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
    .page-block ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.55}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat{padding:14px;border-radius:var(--radius-md);background:var(--glass);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}
    .stat .num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:28px;font-weight:700;color:var(--pink);line-height:1.1}
    .stat .lbl{margin-top:4px;font-size:12px;color:var(--muted);font-weight:600}
    .week-day{padding:14px 16px;margin-bottom:10px}
    .week-day .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .week-day .day{font-weight:700;font-size:15px}
    .week-day .mins{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:var(--pink);font-weight:700;font-size:13px}
    .week-titles{font-size:12px;color:var(--muted);line-height:1.45}
    @media (prefers-reduced-motion:no-preference){
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .card,.ribbon,.glass-header,.page-block,.week-day,.brave{animation:rise .35s ease both}
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>

  function ageInfo(now){
    const daysToFour=Math.max(0,Math.ceil((TURNS4-now)/86400000));
    const turnedFour=now>=TURNS4;
    const months=(now.getFullYear()-BIRTHDAY.getFullYear())*12+(now.getMonth()-BIRTHDAY.getMonth())-(now.getDate()<BIRTHDAY.getDate()?1:0);
    return{months:Math.max(0,months),daysToFour,turnedFour,displayAge:turnedFour?'4 岁':Math.floor(months/12)+' 岁 '+(months%12)+' 个月'};
  }
  function isWeekend(d){const x=d.getDay();return x===0||x===6}
  function budget(d){return isWeekend(d)?300:90}
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function seed(k){let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6d2b79f5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
  function shuffle(a,rnd){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}return b}
  function buildPlan(now){
    const k=key(now),rnd=seed(k),weekend=isWeekend(now),bud=budget(now),age=ageInfo(now);
    const pool=ACT.slice();const domains=['health','language','social','science','art'];
    const picked=[],used=new Set(),hits=new Set();
    function score(a){let s=rnd();
      if(weekend&&a.weekendBoost)s+=2.5;if(!weekend&&a.minutes>25)s-=1.2;if(!weekend&&a.minutes<=15)s+=.4;

      if(a.focus.some(function(f){return PRIO.indexOf(f)>=0}))s+=1.6;

      s-=picked.filter(function(p){return p.domain===a.domain}).length*.25;
      if(a.weekendBoost&&!weekend)s-=2;return s}
    const target=weekend?7:4,softMax=weekend?320:100;
    const brave=pool.filter(function(a){return a.id.indexOf('brave-')===0}).sort(function(x,y){return score(y)-score(x)})[0];
    if(brave){picked.push(brave);used.add(brave.id);brave.focus.forEach(function(f){hits.add(f)})}
    const must=weekend?domains:shuffle(domains,rnd).slice(0,4);
    must.forEach(function(domain){
      const c=pool.filter(function(a){return a.domain===domain&&!used.has(a.id)}).sort(function(x,y){return score(y)-score(x)});
      if(c[0]){picked.push(c[0]);used.add(c[0].id);c[0].focus.forEach(function(f){hits.add(f)})}});
    let total=picked.reduce(function(s,a){return s+a.minutes},0);
    let loops=0;
    while(picked.length<target&&loops<40){loops++;
      const c=pool.filter(function(a){return !used.has(a.id)}).map(function(a){return{a:a,s:score(a)}}).sort(function(x,y){return y.s-x.s});
      let added=false;
      for(let i=0;i<c.length;i++){const a=c[i].a;if(total+a.minutes<=softMax){picked.push(a);used.add(a.id);a.focus.forEach(function(f){hits.add(f)});total+=a.minutes;added=true;break}}
      if(!added){const fb=pool.filter(function(a){return !used.has(a.id)&&a.minutes+total<=softMax+20}).sort(function(x,y){return x.minutes-y.minutes})[0];if(!fb)break;picked.push(fb);used.add(fb.id);total+=fb.minutes}

    while(total>bud+(weekend?40:15)&&picked.length>3){
      let idx=-1,mm=-1;

      if(idx<0)break;total-=picked[idx].minutes;picked.splice(idx,1)}
    picked.sort(function(a,b){const ab=a.id.indexOf('brave-')===0?1:0,bb=b.id.indexOf('brave-')===0?1:0;if(ab!==bb)return bb-ab;
      const ap=a.focus.filter(function(f){return PRIO.indexOf(f)>=0}).length;const bp=b.focus.filter(function(f){return PRIO.indexOf(f)>=0}).length;
      if(weekend)return (b.weekendBoost?1:0)-(a.weekendBoost?1:0)||b.minutes-a.minutes;return bp-ap||a.minutes-b.minutes});
    const dm=domains.map(function(domain){const minutes=picked.filter(function(p){return p.domain===domain}).reduce(function(s,a){return s+a.minutes},0);const m=DOMAIN[domain];return{domain:domain,name:m.name,color:m.color,emoji:m.emoji,minutes:minutes}});
    const br=picked.filter(function(a){return a.id.indexOf('brave-')===0})[0];
    return{dateKey:k,weekdayLabel:WEEK[now.getDay()],dateLabel:now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日',isWeekend:weekend,budgetMinutes:bud,plannedMinutes:total,slots:picked,domainMinutes:dm,age:age,choice:CHOICE[Math.floor(rnd()*CHOICE.length)],braveFocus:br?{title:br.title,hint:'练习说“停”、走开、告诉老师/家长。告诉大人不是告状，是保护自己。'}:{title:'今日勇气一句',hint:'睡前回忆：今天有没有“说出来就很棒”的事？没有也没关系，明天继续练。'}};
  }

    const doneList=prog[plan.dateKey]||[];
    const doneCount=plan.slots.filter(function(s){return doneList.indexOf(s.id)>=0}).length+(doneList.indexOf(plan.choice.id)>=0?1:0);
    const pct=Math.round(doneCount/(plan.slots.length+1)*100);
    let main='';
    if(tab==='today'){
      const pills=plan.domainMinutes.filter(function(d){return d.minutes>0}).map(function(d){return '<span class="pill"><span class="orb" style="background:'+d.color+'"></span>'+esc(d.name)+'<span class="min">'+d.minutes+'′</span></span>'}).join('');
      const bar=plan.domainMinutes.filter(function(d){return d.minutes>0}).map(function(d){return '<span style="width:'+(d.minutes/Math.max(plan.plannedMinutes,1)*100)+'%;background:'+d.color+'"></span>'}).join('');
      const cards=plan.slots.map(function(s){
        const m=DOMAIN[s.domain];const chips=s.focus.slice(0,4).map(function(f){return '<span class="chip">'+esc(FOCUS[f]||f)+'</span>'}).join('')+(s.focus.some(function(f){return PRIO.indexOf(f)>=0})?'<span class="chip focus">重点</span>':'');
        const done=doneList.indexOf(s.id)>=0;const open=openId===s.id;
        return '<article class="glass card'+(open?' open':'')+(done?' done':'')+'" data-id="'+s.id+'"><div class="card-head" data-open="'+s.id+'"><div class="orb-lg" style="--orb-color:'+m.color+'">'+m.emoji+'</div><div class="card-body"><h3 class="card-title">'+esc(s.title)+'</h3><div class="card-meta"><span class="chip" style="color:'+m.color+'">'+m.name+' · '+s.minutes+' 分钟</span>'+chips+'</div>'+(s.guide?'<p class="card-guide">《指南》：'+esc(s.guide)+'</p>':'')+'</div></div><ul class="card-steps">'+s.steps.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+(s.materials?'<li>材料：'+esc(s.materials)+'</li>':'')+'</ul><div class="card-foot"><div class="card-tip">'+esc(s.tip||'轻松玩就好，过程比结果重要。')+'</div><button type="button" class="check'+(done?' on':'')+'" data-check="'+s.id+'" aria-label="打卡">✓</button></div></article>';
      }).join('');
      const ch=plan.choice;const chDone=doneList.indexOf(ch.id)>=0;
      cards+='<article class="glass card"><div class="card-head"><div class="orb-lg" style="--orb-color:var(--pink-soft)">🫧</div><div class="card-body"><h3 class="card-title">自选角 · '+esc(ch.label)+'</h3><div class="card-meta"><span class="chip focus">她来决定</span><span class="chip">约 '+ch.minutes+' 分钟</span></div><p class="card-guide">没有“男孩游戏 / 女孩游戏”。运动、搭建、科学、故事、创作、当队长——想试哪个就试哪个。今天可以试：'+esc(ch.hint)+'</p><ul class="card-steps always"><li>问：“你今天最想玩哪一种？”</li><li>让她先选方向，家长只配合</li><li>问“你发现了什么？”而不是教标准答案</li></ul></div></div><div class="card-foot"><div class="card-tip">选择本身就是成长。</div><button type="button" class="check'+(chDone?' on':'')+'" data-check="'+ch.id+'" aria-label="自选角打卡">✓</button></div></article>';
      main='<div class="date-row"><span class="wd">'+plan.weekdayLabel+'</span><span class="full">'+plan.dateLabel+' · '+(plan.isWeekend?'周末长时段':'工作日 1.5 小时')+'</span></div>'+
        '<section class="glass ribbon"><div class="ribbon-top"><div><h2>今日时间花环</h2><div class="ribbon-pills">'+pills+'</div></div><div class="budget">'+plan.plannedMinutes+'<span style="font-size:13px;color:var(--muted)"> / '+plan.budgetMinutes+' 分</span></div></div><div class="ribbon-bar">'+bar+'</div><div style="margin-top:10px;font-size:12px;color:var(--muted);font-weight:600">已完成 '+doneCount+'/'+(plan.slots.length+1)+' · 汉字/英语/数学/逻辑 + 勇敢表达 + 自选</div><div class="progress-bar"><i style="width:'+pct+'%"></i></div></section>'+
        '<section class="glass brave"><h3>💪 今日勇气练习 · '+esc(plan.braveFocus.title)+'</h3><p>'+esc(plan.braveFocus.hint)+'</p><div class="guide-tag">家里先练：说“停” → 走开 → 告诉老师/家长</div></section>'+
        '<div class="section-title"><h2>今日活动</h2><span class="hint">点开看步骤 · 圆圈打卡</span></div><div class="cards">'+cards+'</div>';
    } else if(tab==='domains'){
      const rows=Object.keys(DOMAIN).map(function(k){const m=DOMAIN[k];return '<section class="glass page-block"><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="orb-lg" style="--orb-color:'+m.color+'">'+m.emoji+'</div><div><h3 style="color:'+m.color+'">'+m.name+'</h3><p style="font-size:12px">'+m.line+'</p></div></div><ul><li>3–4 岁与 4–4.5 岁目标对照《3-6岁儿童学习与发展指南》</li><li>在游戏中发展，不追求超前刷题</li></ul></section>'}).join('');
      main='<section class="glass page-block" style="border-color:rgba(255,45,149,.25)"><h3 style="color:var(--pink-deep)">不设限的成长</h3><p>粉色只是界面颜色，不是内容边界。运动、搭建、科学实验、当队长、沙土探索，和认字、英语、画画同样重要。每天有一角由<strong style="color:var(--ink)">她自己选</strong>。</p><div class="guide-tag">想试什么就试什么</div></section>'+
        '<section class="glass page-block" style="border-color:rgba(255,45,149,.35)"><h3 style="color:var(--pink-deep)">💪 勇敢表达</h3><p>若她胆小、被欺负不敢说，请把「说清楚 + 会求助」当作和认字一样重要的能力。</p><ul><li>① 大声说：<strong>停！我不喜欢这样。</strong></li><li>② 离开现场，不硬拼。</li><li>③ <strong>告诉老师或家长</strong>——不是告状，是求助。</li><li>④ 家里永远相信她，不先批评“怎么不打回去”。</li></ul></section>'+
        '<div class="section-title"><h2>五大领域</h2><span class="hint">对照《指南》</span></div>'+rows+
        '<section class="glass page-block"><h3>本期重点方向</h3><p style="margin-top:8px"><strong style="color:var(--pink-deep)">汉字</strong> · 生活场景认字与图卡，不要求书写量。</p><p style="margin-top:8px"><strong style="color:var(--pink-deep)">英语</strong> · 听说先行，儿歌与单词游戏。</p><p style="margin-top:8px"><strong style="color:var(--pink-deep)">数学</strong> · 点数、比较、规律、形状。</p><p style="margin-top:8px"><strong style="color:var(--pink-deep)">逻辑</strong> · 分类、排序、迷宫、因果。</p><p style="margin-top:8px">这些<strong>不是全部</strong>，五领域同等重要。</p></section>';
    } else if(tab==='week'){
      const start=new Date(now);const dow=start.getDay();start.setDate(start.getDate()+(dow===0?-6:1-dow));
      let rows='';
      for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const p=buildPlan(d);
        const bar=p.domainMinutes.filter(function(x){return x.minutes>0}).map(function(x){return '<span style="width:'+(x.minutes/Math.max(p.plannedMinutes,1)*100)+'%;background:'+x.color+'"></span>'}).join('');
        rows+='<section class="glass week-day"><div class="row"><div class="day">'+p.weekdayLabel+' <span style="margin-left:8px;font-weight:500;color:var(--muted);font-size:12px">'+p.dateLabel.slice(5)+'</span></div><div class="mins">'+p.plannedMinutes+'′ '+(p.isWeekend?'· 周末':'')+'</div></div><div class="ribbon-bar" style="height:8px;margin:0 0 10px">'+bar+'</div><div class="week-titles">'+p.slots.map(function(s){return esc(s.title)}).join(' · ')+'<div style="margin-top:4px;color:var(--pink-deep);font-weight:600">🫧 自选：'+esc(p.choice.label)+'</div></div></section>'}
      main='<div class="section-title"><h2>本周节律</h2><span class="hint">工作日 90 分 · 周末 300 分</span></div><section class="glass page-block"><h3>节奏说明</h3><p>周一到周五短而稳，穿插重点与勇敢练习、自选角。周末是更长的开放探索，孩子参与做计划。</p></section>'+rows;
    } else if(tab==='stories'){
      const cards=STORIES.map(function(s){
        return '<article class="glass card open"><div class="card-head"><div class="orb-lg" style="--orb-color:#FF6B9D">👮‍♀️</div><div class="card-body"><h3 class="card-title">'+esc(s.title)+'</h3><div class="card-meta"><span class="chip" style="color:var(--pink)">'+esc(s.minutes)+'</span>'+s.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div><p class="card-guide">'+esc(s.scene)+'</p></div></div><ul class="card-steps always"><li style="counter-increment:none;white-space:pre-wrap"><strong style="color:var(--pink-deep)">提示词（可复制）</strong>\n\n'+esc(s.prompt)+'</li><li style="counter-increment:none">家长提示：'+esc(s.parentNote)+'</li></ul><div class="card-foot"><div class="card-tip">'+(copiedId===s.id?'已复制，去聊天框粘贴吧':'复制后发给豆包/元宝/千问即可')+'</div><button type="button" class="check on" style="width:auto;min-width:44px;padding:0 14px;border-radius:999px;font-size:13px" data-copy="'+s.id+'">'+(copiedId===s.id?'✓ 已复制':'复制')+'</button></div></article>';
      }).join('');
      main='<div class="section-title"><h2>睡前故事提示词</h2><span class="hint">豆包 / 元宝 / 千问</span></div>'+
        '<section class="glass page-block" style="border-color:rgba(255,45,149,.3)"><h3 style="color:var(--pink-deep)">给家长</h3><p>女儿想当警察，喜欢黑猫警长，爱长故事和互动故事。提示词可直接粘贴；AI 会边讲边问。重点：安全感、勇敢说清楚、会求助、合作与善良。</p><ul>'+PARENT_TIPS.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul></section><div class="cards">'+cards+'</div>';
    } else {
      const keys=Object.keys(prog).sort().slice(-14).reverse();
      let all=0;Object.keys(prog).forEach(function(k){all+= (prog[k]||[]).length});
      const map={health:0,language:0,social:0,science:0,art:0};
      Object.keys(prog).forEach(function(k){(prog[k]||[]).forEach(function(id){const a=ACT.filter(function(x){return x.id===id})[0];if(a)map[a.domain]++})});
      const max=Math.max(1,map.health,map.language,map.social,map.science,map.art);
      const bars=Object.keys(DOMAIN).map(function(k){const m=DOMAIN[k],n=map[k]||0;return '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>'+m.emoji+' '+m.name+'</span><span style="color:var(--muted)">'+n+' 次</span></div><div class="progress-bar"><i style="width:'+(n/max*100)+'%;background:'+m.color+'"></i></div></div>'}).join('');
      const list=keys.length?'<div>'+keys.map(function(k){return '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.5)"><span style="font-weight:600;font-size:14px">'+k+'</span><span style="color:var(--pink);font-family:ui-monospace,SF Mono,Menlo,monospace;font-weight:700">'+(prog[k]||[]).length+' 项</span></div>'}).join('')+'</div>':'<div style="padding:20px 0;text-align:center;color:var(--muted);font-size:14px">还没有打卡。今天任意完成一项就会出现在这里。</div>';
      main='<div class="section-title"><h2>成长足迹</h2><span class="hint">仅保存在本机</span></div><div class="stat-grid"><div class="stat"><div class="num">'+doneCount+'</div><div class="lbl">今日完成</div></div><div class="stat"><div class="num">'+all+'</div><div class="lbl">累计打卡</div></div><div class="stat"><div class="num">'+Object.keys(prog).length+'</div><div class="lbl">有记录天数</div></div><div class="stat"><div class="num" style="font-size:20px;padding-top:4px">'+(age.turnedFour?'4 岁':age.daysToFour+'d')+'</div><div class="lbl">'+(age.turnedFour?'年龄':'距 4 岁')+'</div></div></div>'+
        '<section class="glass page-block"><h3>数据备份（JSON）</h3><p>打卡仅存在本机浏览器。换手机或清缓存前请先导出，新设备再导入。</p><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button type="button" id="btn-export" style="min-height:44px;padding:0 16px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--pink-soft));color:#fff;font-weight:700;font-size:14px">导出 JSON</button><button type="button" id="btn-import" style="min-height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(255,107,157,.35);color:var(--pink-deep);font-weight:700;font-size:14px">导入 JSON</button><input id="file-import" type="file" accept="application/json,.json" hidden /></div>'+(progMsg?'<div class="guide-tag" style="margin-top:10px">'+esc(progMsg)+'</div>':'')+'<p style="margin-top:10px;font-size:12px">当前 <strong style="color:var(--pink)">'+Object.keys(prog).length+'</strong> 天数据 · 活动库 <strong style="color:var(--pink)">'+ACT.length+'</strong> 条（每日按日期自动组合）</p></section>'+
        '<section class="glass page-block"><h3>领域覆盖（累计）</h3><p>覆盖是参考不是排名。长期尽量五领域都碰到。</p>'+bars+'</section>'+
        '<section class="glass page-block"><h3>最近有记录的日子</h3>'+list+'</section>'+
        '<section class="glass page-block"><h3>给家长的一句话</h3><p>目标不是学了多少字，而是她更愿意表达、更敢尝试、更会想办法。若她胆小：先共情，再一起练“说停—走开—告诉老师”。她可以文静，也可以大声维护自己——都对。</p></section>';
    }
    const tabs=[['today','今日','🌸'],['domains','领域','🧩'],['stories','故事','👮‍♀️'],['progress','成长','💗']];
    const nav='<nav class="glass tabbar">'+tabs.map(function(t){return '<button type="button" class="tab'+(tab===t[0]?' active':'')+'" data-tab="'+t[0]+'"><span class="ico">'+t[2]+'</span>'+t[1]+'</button>'}).join('')+'</nav>';
    document.getElementById('app').innerHTML='<header class="glass glass-header"><div class="brand"><div class="brand-kicker">3–6 岁成长指南</div><h1 class="brand-title">小芽成长</h1></div><div class="age-badge"><div class="days">'+(age.turnedFour?'已满 4 岁 🎂':'距 4 岁 · '+age.daysToFour+' 天')+'</div><div class="meta">'+age.displayAge+'</div></div></header><main>'+main+'</main>'+nav;
  }
  document.getElementById('app').addEventListener('click',function(e){
    const t=e.target;
    const tabBtn=t.closest('[data-tab]');
    if(tabBtn){tab=tabBtn.getAttribute('data-tab');openId=null;copiedId=null;render();return}
    const copyBtn=t.closest('[data-copy]');
    if(copyBtn){const id=copyBtn.getAttribute('data-copy');const s=STORIES.filter(function(x){return x.id===id})[0];
      if(s&&navigator.clipboard){navigator.clipboard.writeText(s.prompt).then(function(){copiedId=id;render();setTimeout(function(){copiedId=null;render()},1600)}).catch(function(){copiedId=id;render()})}
      else if(s){const ta=document.createElement('textarea');ta.value=s.prompt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(err){}document.body.removeChild(ta);copiedId=id;render();setTimeout(function(){copiedId=null;render()},1600)}
      return}
    const check=t.closest('[data-check]');
    if(check){const id=check.getAttribute('data-check');const now=new Date();prog=toggle(id,key(now));render();return}
    if(t.id==='btn-export'){exportProg();return}
    if(t.id==='btn-import'){const fi=document.getElementById('file-import');if(fi)fi.click();return}
    const open=t.closest('[data-open]');
    if(open){const id=open.getAttribute('data-open');openId=(openId===id?null:id);render();return}
  });
  render();
  document.addEventListener('change',function(e){
    const el=e.target;
    if(el&&el.id==='file-import'&&el.files&&el.files[0]){importProg(el.files[0]);el.value=''}
  });
})();
  </script>
</body>
</html>
